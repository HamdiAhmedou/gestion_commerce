name: gestion_commerce
description: Application de gestion de commerce - MVC + Provider + SQLite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  flutter_slidable: ^4.0.3
  intl: ^0.20.2
  provider: ^6.1.2
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.1.0
  go_router: ^17.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/